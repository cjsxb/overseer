<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overseer · Advancing Malware Detection</title>
<meta name="description" content="Overseer: an AI malware analyst that catches malware signature scanners miss. UTS Honours project by Callum Burke.">
<style>
  :root { --navy:#0D366B; --blue:#2A78D6; --ink:#0B0B0B; --ink2:#52514E; --panel:#F0EFEC; --line:#E1E0D9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
  header { background:var(--navy); color:#fff; padding:40px 20px 32px; text-align:center; }
  header h1 { margin:0 0 6px; font-size:1.9rem; letter-spacing:.02em; }
  header p { margin:0; opacity:.85; }
  main { max-width:520px; margin:0 auto; padding:24px 20px 40px; }
  .stats { display:flex; gap:10px; margin-bottom:24px; }
  .stat { flex:1; background:var(--panel); border-radius:10px; padding:12px 8px; text-align:center; }
  .stat b { display:block; font-size:1.4rem; color:var(--navy); }
  .stat span { font-size:.78rem; color:var(--ink2); }
  a.link, div.link { display:block; padding:16px 18px; margin:12px 0; border-radius:12px; border:2px solid var(--navy);
         color:var(--navy); text-decoration:none; font-weight:600; text-align:center; transition:background .15s,color .15s; }
  a.link:hover, a.link:focus { background:var(--navy); color:#fff; }
  div.link { border-style:dashed; border-color:var(--line); color:var(--ink2); }
  .soon { display:block; font-weight:400; font-size:.8rem; margin-top:4px; }
  footer { text-align:center; color:var(--ink2); font-size:.85rem; padding:0 20px 32px; }
</style>
</head>
<body>
<header>
  <h1>Overseer</h1>
  <p>Advancing malware detection with AI-led static analysis</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><b>92.2%</b><span>correct on 1,000 files</span></div>
    <div class="stat"><b>0</b><span>false positives</span></div>
    <div class="stat"><b>10 / 12</b><span>new malware caught</span></div>
  </div>

  <!-- To turn a placeholder into a real link, replace the <div class="link">…</div>
       with: <a class="link" href="https://YOUR-LINK">Label</a> -->
  <div class="link">Live demo<span class="soon">Coming soon</span></div>
  <div class="link">Project summary<span class="soon">Coming soon</span></div>
  <div class="link">Thesis<span class="soon">Coming soon</span></div>
  <div class="link">Contact<span class="soon">Coming soon</span></div>
</main>
<footer>Callum Burke · Supervised by Justin Lipman · University of Technology Sydney</footer>
</body>
</html>
